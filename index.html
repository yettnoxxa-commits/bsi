<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b38">
  <title>Rangka — Penjualan Konstruksi</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20302c;
      --muted: #73807a;
      --line: #e5e9e4;
      --paper: #f5f6f1;
      --white: #fff;
      --forest: #173b38;
      --forest-soft: #e7efeb;
      --orange: #e47b3b;
      --orange-soft: #fff0e4;
      --blue: #497c91;
      --blue-soft: #e9f1f4;
      --red: #b54b42;
      --red-soft: #faece9;
      --green: #39815d;
      --green-soft: #e8f3eb;
      --shadow: 0 16px 42px rgba(30, 50, 43, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#dfe5dc 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      font-size: 14px;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app-shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
      padding: 25px 17px 18px; color: #ecf3ed; background: var(--forest);
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 2px 10px 30px; }
    .brand-mark { display: grid; place-items: center; width: 37px; height: 37px; color: var(--forest); background: #f2a36a; border-radius: 10px 3px 10px 3px; font-weight: 800; font-size: 19px; }
    .brand-name { font-family: Georgia, "Times New Roman", serif; font-size: 22px; letter-spacing: 0; }
    .brand-caption { margin-top: 3px; color: #a9c1b3; font-size: 10px; text-transform: uppercase; }
    .nav-label { padding: 0 11px 9px; color: #89a79a; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .nav-list { display: grid; gap: 5px; }
    .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 12px; border: 0; border-radius: 5px; color: #c6d5cb; background: transparent; text-align: left; }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,.07); }
    .nav-item.active { color: #fff; background: #28534a; box-shadow: inset 3px 0 var(--orange); }
    .nav-glyph { width: 20px; color: #f0a36d; font-size: 16px; text-align: center; }
    .sidebar-bottom { margin-top: auto; padding: 15px 11px 4px; border-top: 1px solid rgba(255,255,255,.13); color: #b4c8bc; font-size: 11px; line-height: 1.7; }
    .sidebar-bottom strong { display: block; color: #f2f4ef; font-size: 12px; }
    .workspace { min-width: 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 76px; padding: 0 38px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.8); }
    .crumb { color: var(--muted); font-size: 12px; }
    .crumb strong { color: var(--ink); font-size: 13px; }
    .topbar-right { display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 12px; }
    .avatar { display: grid; place-items: center; width: 34px; height: 34px; color: var(--forest); background: #e5eee8; border-radius: 50%; font-weight: 700; }
    main { max-width: 1520px; margin: 0 auto; padding: 30px 38px 50px; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 7px; color: var(--orange); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 30px; font-weight: 500; line-height: 1.15; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: var(--white); font-weight: 650; text-decoration: none; }
    .button:hover { border-color: #a9b9ae; }
    .button.primary { border-color: var(--forest); color: #fff; background: var(--forest); }
    .button.primary:hover { background: #25534b; }
    .button.warm { border-color: var(--orange); color: #fff; background: var(--orange); }
    .button.danger { color: var(--red); }
    .button.small { min-height: 30px; padding: 0 9px; font-size: 11px; }
    .button:disabled { cursor: not-allowed; opacity: .5; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-bottom: 19px; }
    .stat-card { position: relative; overflow: hidden; min-height: 124px; padding: 17px 18px; border: 1px solid var(--line); border-radius: 5px; background: var(--white); }
    .stat-card::after { position: absolute; right: -20px; bottom: -33px; width: 88px; height: 88px; border: 1px solid #edf0eb; border-radius: 50%; content: ""; }
    .stat-label { color: var(--muted); font-size: 11px; }
    .stat-value { margin-top: 12px; font-family: Georgia, "Times New Roman", serif; font-size: 26px; }
    .stat-note { margin-top: 5px; color: var(--muted); font-size: 10px; }
    .stat-accent { position: absolute; top: 17px; right: 17px; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(260px, .85fr); gap: 16px; }
    .panel { min-width: 0; border: 1px solid var(--line); border-radius: 5px; background: var(--white); }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 19px; border-bottom: 1px solid var(--line); }
    .panel-title { margin: 0; font-size: 14px; font-weight: 700; }
    .panel-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .panel-body { padding: 17px 19px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
    th { padding: 10px 12px; color: var(--muted); background: #f8f9f6; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    td { padding: 12px; border-top: 1px solid #edf0eb; font-size: 12px; }
    tbody tr:hover { background: #fbfcfa; }
    .table-empty { padding: 30px 14px; color: var(--muted); text-align: center; white-space: normal; }
    .item-name { font-weight: 700; }
    .item-meta { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .money { font-variant-numeric: tabular-nums; }
    .status { display: inline-block; padding: 4px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; }
    .status.paid { color: var(--green); background: var(--green-soft); }
    .status.due { color: #a46a25; background: #fbf1df; }
    .status.low { color: var(--red); background: var(--red-soft); }
    .status.ok { color: var(--green); background: var(--green-soft); }
    .stock-list { display: grid; gap: 15px; }
    .stock-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; }
    .stock-name { font-size: 12px; font-weight: 650; }
    .stock-qty { color: var(--muted); font-size: 11px; }
    .stock-track { grid-column: 1 / -1; height: 5px; overflow: hidden; border-radius: 4px; background: #edf0eb; }
    .stock-fill { height: 100%; border-radius: inherit; background: var(--blue); }
    .stock-fill.low { background: var(--orange); }
    .inline-alert { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 17px; padding: 11px 12px; border-radius: 4px; color: #895b29; background: var(--orange-soft); font-size: 11px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
    .input, .select { width: 100%; min-height: 38px; padding: 0 11px; border: 1px solid #dfe5de; border-radius: 4px; outline: none; color: var(--ink); background: #fff; }
    .input:focus, .select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(73,124,145,.12); }
    .toolbar .input { width: min(270px, 100%); }
    .filter-select { width: auto; min-width: 145px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field label { color: #53625b; font-size: 11px; font-weight: 700; }
    .field.full { grid-column: 1 / -1; }
    .form-hint { color: var(--muted); font-size: 10px; line-height: 1.5; }
    .sell-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, .8fr); align-items: start; gap: 16px; }
    .cart-line { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .cart-line:last-child { border-bottom: 0; }
    .cart-price { color: var(--muted); font-size: 11px; }
    .cart-total { display: flex; justify-content: space-between; gap: 12px; padding-top: 13px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 700; }
    .summary-box { margin-top: 14px; padding: 13px; border-radius: 4px; background: #f6f8f5; }
    .summary-row { display: flex; justify-content: space-between; gap: 14px; margin: 7px 0; color: var(--muted); font-size: 11px; }
    .summary-row.total { margin-top: 12px; padding-top: 11px; border-top: 1px solid #dfe5de; color: var(--ink); font-size: 15px; font-weight: 800; }
    .notice { margin-top: 13px; padding: 11px 12px; border-left: 3px solid var(--blue); color: #4d6873; background: var(--blue-soft); font-size: 11px; line-height: 1.5; }
    .customer-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
    .customer-row { padding: 15px; border: 1px solid var(--line); border-radius: 4px; }
    .customer-row strong { display: block; margin-bottom: 7px; font-size: 13px; }
    .customer-row span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .dashboard-hero { position: relative; display: grid; grid-template-columns: minmax(0,1fr) 295px; align-items: center; gap: 24px; overflow: hidden; min-height: 206px; margin-bottom: 17px; padding: 25px 29px; border-radius: 5px; color: #f5f3e9; background: #173b38; }
    .dashboard-hero::before { position: absolute; top: -94px; right: 222px; width: 180px; height: 360px; border: 1px solid rgba(229,239,228,.09); transform: rotate(32deg); content: ""; }
    .dashboard-hero::after { position: absolute; right: 300px; bottom: -110px; width: 200px; height: 200px; border: 1px solid rgba(229,239,228,.09); border-radius: 50%; content: ""; }
    .hero-copy, .hero-chart { position: relative; z-index: 1; }
    .hero-kicker { display: flex; align-items: center; gap: 8px; color: #f3ac78; font-size: 10px; font-weight: 750; text-transform: uppercase; }
    .hero-kicker::before { width: 17px; height: 2px; background: var(--orange); content: ""; }
    .dashboard-hero h1 { margin-top: 12px; color: #fffdf5; font-size: 29px; }
    .dashboard-hero p { margin: 8px 0 17px; color: #c1d0c7; font-size: 12px; }
    .hero-chart { padding: 13px 15px 10px; border: 1px solid rgba(237,245,237,.15); border-radius: 4px; background: rgba(255,255,255,.055); }
    .hero-chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .hero-chart-head span { color: #c0d1c5; font-size: 10px; }
    .hero-chart-head strong { color: #fff; font-family: Georgia, "Times New Roman", serif; font-size: 17px; font-weight: 500; }
    .week-bars { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); align-items: end; gap: 8px; height: 83px; margin-top: 11px; }
    .week-bar-slot { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; color: #abc0b2; font-size: 9px; }
    .week-bar { width: min(18px, 100%); min-height: 3px; border-radius: 2px 2px 0 0; background: #e9945b; }
    .week-bar-slot.today .week-bar { background: #f3cf8d; }
    .stat-card { transition: transform .18s ease, box-shadow .18s ease; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,50,43,.07); }
    .report-strip { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
    .report-metric { padding: 15px 17px; border-left: 3px solid var(--orange); background: #fff; }
    .report-metric span { color: var(--muted); font-size: 11px; }
    .report-metric strong { display: block; margin-top: 9px; font-family: Georgia, "Times New Roman", serif; font-size: 21px; font-weight: 500; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 20; max-width: min(380px, calc(100vw - 36px)); padding: 13px 17px; border-radius: 4px; color: #fff; background: var(--forest); box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); transition: opacity .2s ease, transform .2s ease; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    dialog { width: min(480px, calc(100vw - 30px)); padding: 0; border: 0; border-radius: 5px; box-shadow: 0 24px 80px rgba(21,40,33,.23); }
    dialog::backdrop { background: rgba(19,39,32,.48); }
    .dialog-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .dialog-header h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 19px; font-weight: 500; }
    .dialog-body { padding: 19px 20px 20px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 19px; }
    .close-button { border: 0; color: var(--muted); background: transparent; font-size: 20px; }
    .mobile-menu { display: none; }
    @media (max-width: 1000px) {
      .app-shell { grid-template-columns: 205px minmax(0,1fr); }
      main { padding: 27px 25px 40px; }
      .topbar { padding: 0 25px; }
      .stats-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .customer-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .dashboard-hero { grid-template-columns: minmax(0,1fr) 250px; }
    }
    @media (max-width: 720px) {
      .app-shell { display: block; }
      .sidebar { position: relative; z-index: 5; width: 100%; height: auto; padding: 12px 14px; }
      .brand { padding: 0 3px 12px; }
      .brand-mark { width: 32px; height: 32px; }
      .brand-name { font-size: 19px; }
      .brand-caption, .nav-label, .sidebar-bottom { display: none; }
      .nav-list { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; }
      .nav-item { flex: 0 0 auto; width: auto; padding: 8px 10px; font-size: 11px; }
      .nav-glyph { width: auto; }
      .topbar { min-height: 55px; padding: 0 17px; }
      .topbar-right { gap: 9px; }
      .topbar-date { display: none; }
      main { padding: 23px 16px 35px; }
      .page-heading { align-items: flex-start; margin-bottom: 19px; }
      h1 { font-size: 26px; }
      .page-heading > .button { flex: 0 0 auto; padding: 0 10px; font-size: 11px; }
      .stats-grid { gap: 9px; }
      .stat-card { min-height: 110px; padding: 13px; }
      .stat-value { font-size: 21px; }
      .dashboard-grid, .sell-layout { grid-template-columns: 1fr; }
      .dashboard-hero { grid-template-columns: 1fr; gap: 14px; padding: 21px; }
      .dashboard-hero::before { right: 5px; }
      .dashboard-hero::after { right: 70px; }
      .dashboard-hero h1 { font-size: 25px; }
      .hero-chart { max-width: none; }
      .panel-header { padding: 14px; }
      .panel-body { padding: 14px; }
      .customer-grid { grid-template-columns: 1fr; }
      .report-strip { grid-template-columns: 1fr; gap: 8px; }
      .toolbar { width: 100%; }
      .toolbar .input { flex: 1 1 100%; width: 100%; }
      .filter-select { flex: 1; min-width: 120px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
    @media print {
      body { background: #fff; }
      .sidebar, .topbar, .page-heading, .toolbar, .button, .no-print { display: none !important; }
      .app-shell { display: block; }
      main { max-width: none; padding: 0; }
      .panel { border: 0; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">R</div><div><div class="brand-name">Rangka</div><div class="brand-caption">Material & konstruksi</div></div></div>
      <div class="nav-label">Ruang kerja</div>
      <nav class="nav-list" aria-label="Navigasi utama">
        <button class="nav-item" data-page="dashboard"><span class="nav-glyph">&#9632;</span>Ringkasan</button>
        <button class="nav-item" data-page="sell"><span class="nav-glyph">+</span>Buat penjualan</button>
        <button class="nav-item" data-page="sales"><span class="nav-glyph">&#9776;</span>Riwayat transaksi</button>
        <button class="nav-item" data-page="products"><span class="nav-glyph">&#9633;</span>Barang & stok</button>
        <button class="nav-item" data-page="customers"><span class="nav-glyph">&#9673;</span>Pelanggan</button>
        <button class="nav-item" data-page="reports"><span class="nav-glyph">&#9641;</span>Laporan</button>
      </nav>
      <div class="sidebar-bottom"><strong>Toko Material Rangka</strong>Semua data tersimpan di perangkat ini.</div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="crumb">Rangka <span aria-hidden="true">/</span> <strong id="breadcrumb">Ringkasan</strong></div><div class="topbar-right"><span class="topbar-date" id="todayDate"></span><span>Administrator</span><span class="avatar">A</span></div></header>
      <main id="mainContent"></main>
    </div>
  </div>
  <dialog id="formDialog"><div class="dialog-header"><h2 id="dialogTitle"></h2><button class="close-button" data-action="close-dialog" aria-label="Tutup">&times;</button></div><div class="dialog-body" id="dialogContent"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const STORAGE_KEY = "rangka-sales-v1";
      const labels = { dashboard: "Ringkasan", sell: "Buat penjualan", sales: "Riwayat transaksi", products: "Barang & stok", customers: "Pelanggan", reports: "Laporan" };
      const starter = {
        products: [
          { id: "p-semen", sku: "SMN-001", name: "Semen Portland 50 kg", category: "Semen", unit: "sak", price: 72000, stock: 86, minStock: 20 },
          { id: "p-bata", sku: "BTA-014", name: "Bata merah press", category: "Bata & blok", unit: "buah", price: 1250, stock: 840, minStock: 200 },
          { id: "p-besi", sku: "BSI-010", name: "Besi beton 10 mm · 12 m", category: "Besi", unit: "batang", price: 89500, stock: 9, minStock: 18 },
          { id: "p-pasir", sku: "PSR-002", name: "Pasir pasang", category: "Agregat", unit: "m³", price: 285000, stock: 14, minStock: 5 },
          { id: "p-cat", sku: "CAT-020", name: "Cat tembok interior 5 kg", category: "Cat & pelapis", unit: "pail", price: 168000, stock: 23, minStock: 8 },
          { id: "p-paku", sku: "PKU-003", name: "Paku beton 5 cm", category: "Perkakas", unit: "kg", price: 26000, stock: 4, minStock: 10 }
        ],
        customers: [
          { id: "c-walkin", name: "Pelanggan umum", phone: "-", address: "Pembelian langsung" },
          { id: "c-cipta", name: "CV Cipta Bangun", phone: "0812-3456-7890", address: "Jl. Pembangunan No. 18" },
          { id: "c-mandiri", name: "Proyek Rumah Mandiri", phone: "0813-7890-1234", address: "Kawasan Sukamaju, Blok C" }
        ], sales: []
      };
      let db;
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        db = saved && Array.isArray(saved.products) && Array.isArray(saved.customers) && Array.isArray(saved.sales) ? saved : structuredClone(starter);
      } catch { db = structuredClone(starter); }
      let page = "dashboard";
      let cart = [];
      let toastTimer;
      const main = document.getElementById("mainContent");
      const dialog = document.getElementById("formDialog");

      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      const rupiah = (amount) => new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(Number(amount) || 0);
      const number = (value) => new Intl.NumberFormat("id-ID").format(Number(value) || 0);
      const dateLabel = (date) => new Intl.DateTimeFormat("id-ID", { day: "2-digit", month: "short", year: "numeric" }).format(new Date(date));
      const persist = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      const getProduct = (id) => db.products.find(product => product.id === id);
      const getCustomer = (id) => db.customers.find(customer => customer.id === id);
      const isLow = (product) => product.stock <= product.minStock;
      const stockValue = () => db.products.reduce((sum, product) => sum + product.stock * product.price, 0);
      const totalSales = (sales) => sales.reduce((sum, sale) => sum + sale.total, 0);
      const makeId = (prefix) => `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
      const todayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
      const todaySales = () => db.sales.filter(sale => sale.createdAt >= todayStart());
      const toast = (message) => {
        const element = document.getElementById("toast"); element.textContent = message; element.classList.add("show");
        clearTimeout(toastTimer); toastTimer = setTimeout(() => element.classList.remove("show"), 2800);
      };
      const pageHeading = (eyebrow, title, subtitle, action = "") => `<div class="page-heading"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="subtitle">${subtitle}</p></div>${action}</div>`;
      const emptyRow = (columns, text) => `<tr><td colspan="${columns}" class="table-empty">${text}</td></tr>`;
      const salesRows = (sales, withAction = false) => sales.length ? sales.map(sale => {
        const customer = getCustomer(sale.customerId);
        return `<tr><td><span class="item-name">${escapeHtml(sale.invoice)}</span><span class="item-meta">${dateLabel(sale.createdAt)}</span></td><td>${escapeHtml(customer?.name || "Pelanggan dihapus")}</td><td>${sale.items.reduce((sum, item) => sum + item.qty, 0)} item</td><td class="money">${rupiah(sale.total)}</td><td><span class="status ${sale.paymentStatus === "Lunas" ? "paid" : "due"}">${sale.paymentStatus}</span></td>${withAction ? `<td><button class="button small" data-action="print-sale" data-id="${escapeHtml(sale.id)}">Cetak</button></td>` : ""}</tr>`;
      }).join("") : emptyRow(withAction ? 6 : 5, "Belum ada transaksi. Penjualan baru akan muncul di sini.");

      function renderDashboard() {
        const today = todaySales();
        const recent = [...db.sales].sort((a, b) => b.createdAt - a.createdAt).slice(0, 5);
        const lowItems = db.products.filter(isLow);
        const stockWatch = [...db.products].sort((a, b) => (a.stock / Math.max(a.minStock, 1)) - (b.stock / Math.max(b.minStock, 1))).slice(0, 4);
        const week = Array.from({ length: 7 }, (_, index) => {
          const date = new Date(); date.setHours(0, 0, 0, 0); date.setDate(date.getDate() - 6 + index);
          const nextDate = new Date(date); nextDate.setDate(nextDate.getDate() + 1);
          const sales = db.sales.filter(sale => sale.createdAt >= date.getTime() && sale.createdAt < nextDate.getTime());
          return { label: new Intl.DateTimeFormat("id-ID", { weekday: "short" }).format(date), amount: totalSales(sales), today: index === 6 };
        });
        const weekPeak = Math.max(1, ...week.map(day => day.amount));
        return `<section class="dashboard-hero"><div class="hero-copy"><div class="hero-kicker">Ringkasan operasional</div><h1>Material siap,<br>proyek bergerak.</h1><p>Pantau penjualan dan persediaan toko hari ini.</p><button class="button warm" data-page="sell">+ Buat penjualan</button></div><div class="hero-chart"><div class="hero-chart-head"><span>Penjualan 7 hari</span><strong>${rupiah(totalSales(week))}</strong></div><div class="week-bars" role="img" aria-label="Grafik penjualan tujuh hari terakhir">${week.map(day => `<div class="week-bar-slot ${day.today ? "today" : ""}" title="${escapeHtml(day.label)}: ${rupiah(day.amount)}"><i class="week-bar" style="height:${day.amount ? Math.max(5, day.amount / weekPeak * 100) : 3}%"></i><span>${escapeHtml(day.label)}</span></div>`).join("")}</div></div></section>
          <section class="stats-grid" aria-label="Ringkasan metrik">
            <article class="stat-card"><span class="stat-accent"></span><div class="stat-label">Penjualan hari ini</div><div class="stat-value">${rupiah(totalSales(today))}</div><div class="stat-note">${today.length} transaksi tercatat</div></article>
            <article class="stat-card"><span class="stat-accent" style="background:var(--blue)"></span><div class="stat-label">Total transaksi</div><div class="stat-value">${number(db.sales.length)}</div><div class="stat-note">Semua transaksi tersimpan</div></article>
            <article class="stat-card"><span class="stat-accent" style="background:var(--green)"></span><div class="stat-label">Jenis barang aktif</div><div class="stat-value">${number(db.products.length)}</div><div class="stat-note">Nilai stok ${rupiah(stockValue())}</div></article>
            <article class="stat-card"><span class="stat-accent" style="background:${lowItems.length ? "var(--red)" : "var(--green)"}"></span><div class="stat-label">Perlu restok</div><div class="stat-value">${number(lowItems.length)} <span style="font:12px 'Segoe UI',sans-serif;color:var(--muted)">barang</span></div><div class="stat-note">Di bawah batas minimum</div></article>
          </section>
          <section class="dashboard-grid">
            <article class="panel"><div class="panel-header"><div><h2 class="panel-title">Transaksi terbaru</h2><p class="panel-subtitle">Aktivitas penjualan yang baru dicatat</p></div><button class="button small" data-page="sales">Lihat semua</button></div><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Pelanggan</th><th>Barang</th><th>Total</th><th>Status</th></tr></thead><tbody>${salesRows(recent)}</tbody></table></div></article>
            <article class="panel"><div class="panel-header"><div><h2 class="panel-title">Pantauan persediaan</h2><p class="panel-subtitle">Stok dibanding batas minimum</p></div></div><div class="panel-body"><div class="stock-list">${stockWatch.map(product => {
              const ratio = Math.min(100, product.stock / Math.max(product.minStock * 2, 1) * 100);
              return `<div class="stock-row"><span class="stock-name">${escapeHtml(product.name)}</span><span class="stock-qty">${number(product.stock)} ${escapeHtml(product.unit)}</span><div class="stock-track"><div class="stock-fill ${isLow(product) ? "low" : ""}" style="width:${ratio}%"></div></div></div>`;
            }).join("")}</div>${lowItems.length ? `<div class="inline-alert"><span>${lowItems.length} barang perlu diperiksa</span><button class="button small" data-page="products">Kelola stok</button></div>` : `<div class="notice">Semua barang berada di atas batas minimum stok.</div>`}</div></article>
          </section>`;
      }

      function renderSell() {
        const available = db.products.filter(product => product.stock > 0);
        const total = cart.reduce((sum, line) => sum + line.qty * line.price, 0);
        return `${pageHeading("Kasir & pesanan", "Buat penjualan", "Pilih pelanggan dan material. Stok diperbarui setelah transaksi disimpan.")}
          <div class="sell-layout"><section class="panel"><div class="panel-header"><div><h2 class="panel-title">Detail pesanan</h2><p class="panel-subtitle">Harga tersimpan sebagai snapshot saat transaksi dibuat.</p></div></div><div class="panel-body">
            <div class="form-grid"><div class="field full"><label for="saleCustomer">Pelanggan</label><select class="select" id="saleCustomer">${db.customers.map(customer => `<option value="${escapeHtml(customer.id)}">${escapeHtml(customer.name)}</option>`).join("")}</select></div>
              <div class="field"><label for="saleProduct">Material</label><select class="select" id="saleProduct"><option value="">Pilih barang</option>${available.map(product => `<option value="${escapeHtml(product.id)}">${escapeHtml(product.name)} · stok ${number(product.stock)} ${escapeHtml(product.unit)}</option>`).join("")}</select></div>
              <div class="field"><label for="saleQty">Jumlah</label><input class="input" id="saleQty" type="number" min="1" step="1" value="1"></div>
              <div class="field full"><button class="button" data-action="add-cart">Tambah barang ke pesanan</button></div></div>
            <div style="margin-top:24px"><h3 class="panel-title">Daftar barang <span style="color:var(--muted);font-weight:400">(${cart.length})</span></h3><div id="cartItems">${cart.length ? cart.map((line, index) => `<div class="cart-line"><div><div class="item-name">${escapeHtml(line.name)}</div><div class="cart-price">${rupiah(line.price)} / ${escapeHtml(line.unit)} · ${number(line.qty)} ${escapeHtml(line.unit)}</div></div><strong class="money">${rupiah(line.price * line.qty)}</strong><button class="button small danger" data-action="remove-cart" data-index="${index}" aria-label="Hapus ${escapeHtml(line.name)}">Hapus</button></div>`).join("") : `<div class="table-empty">Belum ada barang dalam pesanan.</div>`}</div></div>
          </div></section>
          <aside class="panel"><div class="panel-header"><div><h2 class="panel-title">Pembayaran</h2><p class="panel-subtitle">Periksa total sebelum menyimpan transaksi</p></div></div><div class="panel-body"><div class="field"><label for="paymentStatus">Status pembayaran</label><select class="select" id="paymentStatus"><option value="Lunas">Lunas</option><option value="Belum bayar">Belum bayar</option></select></div>
            <div class="summary-box"><div class="summary-row"><span>Jumlah barang</span><strong>${number(cart.reduce((sum, line) => sum + line.qty, 0))} unit</strong></div><div class="summary-row"><span>Subtotal</span><strong>${rupiah(total)}</strong></div><div class="summary-row"><span>Pajak</span><strong>Termasuk harga</strong></div><div class="summary-row total"><span>Total tagihan</span><strong>${rupiah(total)}</strong></div></div>
            <button class="button primary" data-action="checkout" style="width:100%;margin-top:14px" ${cart.length ? "" : "disabled"}>Simpan transaksi</button><p class="form-hint" style="margin-top:10px">Nomor invoice dibuat otomatis. Stok tidak berubah jika transaksi gagal.</p></div></aside></div>`;
      }

      function renderSales() {
        return `${pageHeading("Arsip penjualan", "Riwayat transaksi", "Cari invoice, tinjau status pembayaran, atau cetak bukti transaksi.", `<button class="button primary" data-page="sell">+ Buat penjualan</button>`)}
          <section class="panel"><div class="panel-header"><div><h2 class="panel-title">Semua transaksi</h2><p class="panel-subtitle">${number(db.sales.length)} transaksi · disimpan lokal</p></div><div class="toolbar"><input class="input" id="salesSearch" placeholder="Cari invoice atau pelanggan" aria-label="Cari transaksi"><select class="select filter-select" id="salesFilter"><option value="all">Semua status</option><option value="Lunas">Lunas</option><option value="Belum bayar">Belum bayar</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Pelanggan</th><th>Barang</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="salesTableBody">${salesRows([...db.sales].sort((a,b) => b.createdAt-a.createdAt), true)}</tbody></table></div></section>`;
      }

      function renderProducts() {
        const products = [...db.products].sort((a,b) => a.name.localeCompare(b.name, "id"));
        return `${pageHeading("Katalog & inventaris", "Barang dan stok", "Harga jual, satuan, dan batas minimum untuk setiap material.", `<button class="button primary" data-action="new-product">+ Tambah barang</button>`)}
          <section class="panel"><div class="panel-header"><div><h2 class="panel-title">Daftar material</h2><p class="panel-subtitle">Nilai persediaan saat ini: ${rupiah(stockValue())}</p></div><div class="toolbar"><input class="input" id="productSearch" placeholder="Cari nama atau SKU" aria-label="Cari barang"></div></div><div class="table-wrap"><table><thead><tr><th>Material</th><th>Kategori</th><th>Harga jual</th><th>Stok</th><th>Batas minimum</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="productsTableBody">${products.length ? products.map(product => `<tr><td><span class="item-name">${escapeHtml(product.name)}</span><span class="item-meta">SKU ${escapeHtml(product.sku)}</span></td><td>${escapeHtml(product.category)}</td><td class="money">${rupiah(product.price)} / ${escapeHtml(product.unit)}</td><td>${number(product.stock)} ${escapeHtml(product.unit)}</td><td>${number(product.minStock)} ${escapeHtml(product.unit)}</td><td><span class="status ${isLow(product) ? "low" : "ok"}">${isLow(product) ? "Perlu restok" : "Tersedia"}</span></td><td><button class="button small" data-action="restock" data-id="${escapeHtml(product.id)}">Tambah stok</button></td></tr>`).join("") : emptyRow(7, "Belum ada barang.")}</tbody></table></div></section>`;
      }

      function renderCustomers() {
        return `${pageHeading("Relasi proyek", "Pelanggan", "Data kontraktor, pemilik proyek, dan pembeli material.", `<button class="button primary" data-action="new-customer">+ Tambah pelanggan</button>`)}
          <div class="customer-grid">${db.customers.map(customer => {
            const count = db.sales.filter(sale => sale.customerId === customer.id).length;
            const amount = totalSales(db.sales.filter(sale => sale.customerId === customer.id));
            return `<article class="customer-row"><strong>${escapeHtml(customer.name)}</strong><span>${escapeHtml(customer.phone)}</span><span>${escapeHtml(customer.address)}</span><span style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">${count} transaksi <b style="float:right;color:var(--ink)">${rupiah(amount)}</b></span></article>`;
          }).join("") || `<div class="panel table-empty">Belum ada pelanggan.</div>`}</div>`;
      }

      function renderReports() {
        const sales = [...db.sales].sort((a,b) => b.createdAt-a.createdAt);
        const outstanding = db.sales.filter(sale => sale.paymentStatus !== "Lunas");
        const sold = db.products.map(product => ({ ...product, qty: db.sales.reduce((sum, sale) => sum + sale.items.filter(item => item.productId === product.id).reduce((sub, item) => sub + item.qty, 0), 0) })).sort((a,b) => b.qty-a.qty).slice(0, 8);
        return `${pageHeading("Analisis toko", "Laporan penjualan", "Rekap nilai transaksi, piutang, dan material paling banyak terjual.", `<button class="button" data-action="export-report">Ekspor CSV</button>`)}
          <section class="report-strip"><div class="report-metric"><span>Total nilai penjualan</span><strong>${rupiah(totalSales(sales))}</strong></div><div class="report-metric"><span>Transaksi lunas</span><strong>${number(db.sales.filter(sale => sale.paymentStatus === "Lunas").length)}</strong></div><div class="report-metric"><span>Belum dibayar</span><strong>${rupiah(totalSales(outstanding))}</strong></div></section>
          <section class="dashboard-grid"><article class="panel"><div class="panel-header"><div><h2 class="panel-title">Material terjual</h2><p class="panel-subtitle">Akumulasi jumlah dari seluruh transaksi</p></div></div><div class="table-wrap"><table><thead><tr><th>Material</th><th>Terjual</th><th>Stok saat ini</th><th>Nilai stok</th></tr></thead><tbody>${sold.filter(product => product.qty > 0).length ? sold.filter(product => product.qty > 0).map(product => `<tr><td class="item-name">${escapeHtml(product.name)}</td><td>${number(product.qty)} ${escapeHtml(product.unit)}</td><td>${number(product.stock)} ${escapeHtml(product.unit)}</td><td class="money">${rupiah(product.stock * product.price)}</td></tr>`).join("") : emptyRow(4, "Belum ada barang terjual.")}</tbody></table></div></article>
          <article class="panel"><div class="panel-header"><div><h2 class="panel-title">Ringkasan persediaan</h2><p class="panel-subtitle">${db.products.length} jenis barang tercatat</p></div></div><div class="panel-body"><div class="summary-row"><span>Nilai stok tersedia</span><strong>${rupiah(stockValue())}</strong></div><div class="summary-row"><span>Barang perlu restok</span><strong>${number(db.products.filter(isLow).length)} jenis</strong></div><div class="summary-row"><span>Total pelanggan</span><strong>${number(db.customers.length)}</strong></div><div class="notice">Untuk membuat salinan laporan transaksi, gunakan tombol ekspor CSV.</div></div></article></section>`;
      }

      function render() {
        document.getElementById("breadcrumb").textContent = labels[page];
        document.querySelectorAll(".nav-item").forEach(item => item.classList.toggle("active", item.dataset.page === page));
        main.innerHTML = ({ dashboard: renderDashboard, sell: renderSell, sales: renderSales, products: renderProducts, customers: renderCustomers, reports: renderReports })[page]();
        if (page === "sales") bindSalesFilters();
        if (page === "products") bindProductSearch();
      }

      function bindSalesFilters() {
        const search = document.getElementById("salesSearch"); const filter = document.getElementById("salesFilter");
        const update = () => {
          const query = search.value.trim().toLocaleLowerCase("id");
          const selected = filter.value;
          const matches = [...db.sales].sort((a,b) => b.createdAt-a.createdAt).filter(sale => {
            const customerName = getCustomer(sale.customerId)?.name || "";
            return (sale.invoice.toLocaleLowerCase("id").includes(query) || customerName.toLocaleLowerCase("id").includes(query)) && (selected === "all" || sale.paymentStatus === selected);
          });
          document.getElementById("salesTableBody").innerHTML = salesRows(matches, true);
        };
        search.addEventListener("input", update); filter.addEventListener("change", update);
      }

      function bindProductSearch() {
        const search = document.getElementById("productSearch");
        search.addEventListener("input", () => {
          const query = search.value.trim().toLocaleLowerCase("id");
          const matches = db.products.filter(product => `${product.name} ${product.sku} ${product.category}`.toLocaleLowerCase("id").includes(query));
          document.getElementById("productsTableBody").innerHTML = matches.length ? matches.map(product => `<tr><td><span class="item-name">${escapeHtml(product.name)}</span><span class="item-meta">SKU ${escapeHtml(product.sku)}</span></td><td>${escapeHtml(product.category)}</td><td class="money">${rupiah(product.price)} / ${escapeHtml(product.unit)}</td><td>${number(product.stock)} ${escapeHtml(product.unit)}</td><td>${number(product.minStock)} ${escapeHtml(product.unit)}</td><td><span class="status ${isLow(product) ? "low" : "ok"}">${isLow(product) ? "Perlu restok" : "Tersedia"}</span></td><td><button class="button small" data-action="restock" data-id="${escapeHtml(product.id)}">Tambah stok</button></td></tr>`).join("") : emptyRow(7, "Barang tidak ditemukan.");
        });
      }

      function showDialog(title, content) { document.getElementById("dialogTitle").textContent = title; document.getElementById("dialogContent").innerHTML = content; dialog.showModal(); }
      function openProductForm() {
        showDialog("Tambah barang", `<form id="productForm"><div class="form-grid"><div class="field"><label for="productSku">SKU</label><input class="input" id="productSku" name="sku" required maxlength="20" placeholder="Contoh: SMN-002"></div><div class="field"><label for="productName">Nama material</label><input class="input" id="productName" name="name" required maxlength="70"></div><div class="field"><label for="productCategory">Kategori</label><input class="input" id="productCategory" name="category" required maxlength="35" placeholder="Contoh: Semen"></div><div class="field"><label for="productUnit">Satuan</label><input class="input" id="productUnit" name="unit" required maxlength="12" placeholder="sak, batang, m³"></div><div class="field"><label for="productPrice">Harga jual (Rp)</label><input class="input" id="productPrice" name="price" type="number" min="1" step="1" required></div><div class="field"><label for="productStock">Stok awal</label><input class="input" id="productStock" name="stock" type="number" min="0" step="1" value="0" required></div><div class="field full"><label for="productMin">Batas minimum stok</label><input class="input" id="productMin" name="minStock" type="number" min="0" step="1" value="5" required></div></div><div class="dialog-actions"><button type="button" class="button" data-action="close-dialog">Batal</button><button class="button primary" type="submit">Simpan barang</button></div></form>`);
      }
      function openCustomerForm() {
        showDialog("Tambah pelanggan", `<form id="customerForm"><div class="form-grid"><div class="field full"><label for="customerName">Nama pelanggan / proyek</label><input class="input" id="customerName" name="name" required maxlength="70"></div><div class="field full"><label for="customerPhone">Nomor telepon</label><input class="input" id="customerPhone" name="phone" maxlength="25" placeholder="Opsional"></div><div class="field full"><label for="customerAddress">Alamat proyek</label><input class="input" id="customerAddress" name="address" maxlength="100" placeholder="Opsional"></div></div><div class="dialog-actions"><button type="button" class="button" data-action="close-dialog">Batal</button><button class="button primary" type="submit">Simpan pelanggan</button></div></form>`);
      }

      function addToCart() {
        const product = getProduct(document.getElementById("saleProduct")?.value);
        const qty = Number(document.getElementById("saleQty")?.value);
        if (!product) return toast("Pilih material terlebih dahulu.");
        if (!Number.isSafeInteger(qty) || qty < 1) return toast("Jumlah harus berupa bilangan bulat minimal 1.");
        const line = cart.find(item => item.productId === product.id);
        if ((line?.qty || 0) + qty > product.stock) return toast(`Stok ${product.name} hanya ${number(product.stock)} ${product.unit}.`);
        if (line) line.qty += qty;
        else cart.push({ productId: product.id, name: product.name, unit: product.unit, price: product.price, qty });
        render();
        toast(`${product.name} ditambahkan ke pesanan.`);
      }

      function checkout() {
        if (!cart.length) return toast("Tambahkan barang sebelum menyimpan transaksi.");
        const customerId = document.getElementById("saleCustomer")?.value;
        if (!getCustomer(customerId)) return toast("Pilih pelanggan yang valid.");
        for (const line of cart) {
          const product = getProduct(line.productId);
          if (!product || !Number.isSafeInteger(line.qty) || line.qty < 1 || product.stock < line.qty) return toast(`Stok ${line.name} berubah. Periksa kembali pesanan.`);
        }
        const createdAt = Date.now();
        const invoice = `INV-${new Intl.DateTimeFormat("id-ID", { year: "2-digit", month: "2-digit", day: "2-digit" }).format(new Date()).replace(/\//g, "")}-${String(db.sales.length + 1).padStart(4, "0")}`;
        const sale = { id: makeId("s"), invoice, customerId, createdAt, paymentStatus: document.getElementById("paymentStatus")?.value || "Lunas", items: cart.map(line => ({ ...line })), total: cart.reduce((sum, line) => sum + line.price * line.qty, 0) };
        sale.items.forEach(line => { getProduct(line.productId).stock -= line.qty; });
        db.sales.push(sale);
        try { persist(); } catch { sale.items.forEach(line => { getProduct(line.productId).stock += line.qty; }); db.sales.pop(); return toast("Penyimpanan gagal. Ruang penyimpanan browser mungkin penuh."); }
        cart = []; page = "sales"; render(); toast(`Transaksi ${invoice} berhasil disimpan.`);
      }

      function restock(id) {
        const product = getProduct(id);
        if (!product) return;
        const raw = window.prompt(`Jumlah stok masuk untuk ${product.name} (${product.unit}):`, "10");
        if (raw === null) return;
        const qty = Number(raw);
        if (!Number.isSafeInteger(qty) || qty < 1) return toast("Jumlah stok masuk harus bilangan bulat minimal 1.");
        product.stock += qty;
        try { persist(); } catch { product.stock -= qty; return toast("Stok gagal disimpan. Periksa ruang penyimpanan browser."); }
        render(); toast(`${number(qty)} ${product.unit} ${product.name} ditambahkan ke stok.`);
      }

      function printSale(id) {
        const sale = db.sales.find(item => item.id === id);
        if (!sale) return;
        const customer = getCustomer(sale.customerId);
        const rows = sale.items.map(item => `<tr><td>${escapeHtml(item.name)}</td><td>${number(item.qty)} ${escapeHtml(item.unit)}</td><td>${rupiah(item.price)}</td><td>${rupiah(item.qty * item.price)}</td></tr>`).join("");
        const printWindow = window.open("", "_blank", "width=760,height=720");
        if (!printWindow) return toast("Izinkan pop-up browser untuk mencetak invoice.");
        printWindow.document.write(`<!doctype html><html lang="id"><head><meta charset="utf-8"><title>${escapeHtml(sale.invoice)}</title><style>body{font:14px Arial,sans-serif;color:#20302c;padding:35px}h1{font:28px Georgia,serif}small{color:#697770}table{width:100%;border-collapse:collapse;margin-top:28px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #ddd}th{font-size:11px;text-transform:uppercase;color:#697770}.total{text-align:right;margin-top:20px;font-size:18px;font-weight:bold}.foot{margin-top:35px;color:#697770;font-size:12px}</style></head><body><h1>Rangka <small>Material & konstruksi</small></h1><p><b>Invoice ${escapeHtml(sale.invoice)}</b><br>${dateLabel(sale.createdAt)}<br>Pelanggan: ${escapeHtml(customer?.name || "Pelanggan dihapus")}<br>${escapeHtml(customer?.phone || "")}</p><table><thead><tr><th>Material</th><th>Jumlah</th><th>Harga</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table><div class="total">Total ${rupiah(sale.total)}</div><p>Status pembayaran: ${escapeHtml(sale.paymentStatus)}</p><div class="foot">Terima kasih telah berbelanja di Toko Material Rangka.</div><script>window.onload=()=>window.print()<\/script></body></html>`);
        printWindow.document.close();
      }

      function exportReport() {
        const rows = [["Invoice", "Tanggal", "Pelanggan", "Material", "Jumlah", "Harga satuan", "Total", "Status pembayaran"]];
        db.sales.forEach(sale => sale.items.forEach(item => rows.push([sale.invoice, new Date(sale.createdAt).toISOString(), getCustomer(sale.customerId)?.name || "", item.name, item.qty, item.price, item.qty * item.price, sale.paymentStatus])));
        const csv = rows.map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(",")).join("\r\n");
        const url = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
        const link = document.createElement("a"); link.href = url; link.download = `laporan-rangka-${new Date().toISOString().slice(0, 10)}.csv`; link.click(); URL.revokeObjectURL(url); toast("Laporan CSV berhasil disiapkan.");
      }

      document.addEventListener("click", event => {
        const pageButton = event.target.closest("[data-page]");
        if (pageButton) { page = pageButton.dataset.page; if (page !== "sell") cart = []; render(); return; }
        const actionButton = event.target.closest("[data-action]");
        if (!actionButton) return;
        const { action, id, index } = actionButton.dataset;
        if (action === "add-cart") addToCart();
        if (action === "remove-cart") { cart.splice(Number(index), 1); render(); }
        if (action === "checkout") checkout();
        if (action === "new-product") openProductForm();
        if (action === "new-customer") openCustomerForm();
        if (action === "restock") restock(id);
        if (action === "print-sale") printSale(id);
        if (action === "export-report") exportReport();
        if (action === "close-dialog") dialog.close();
      });

      document.addEventListener("submit", event => {
        if (event.target.id === "productForm") {
          event.preventDefault();
          const data = new FormData(event.target);
          const sku = String(data.get("sku")).trim();
          if (db.products.some(product => product.sku.toLocaleLowerCase("id") === sku.toLocaleLowerCase("id"))) return toast("SKU tersebut sudah digunakan.");
          const product = { id: makeId("p"), sku, name: String(data.get("name")).trim(), category: String(data.get("category")).trim(), unit: String(data.get("unit")).trim(), price: Number(data.get("price")), stock: Number(data.get("stock")), minStock: Number(data.get("minStock")) };
          if (!Number.isSafeInteger(product.price) || product.price < 1 || !Number.isSafeInteger(product.stock) || product.stock < 0 || !Number.isSafeInteger(product.minStock) || product.minStock < 0) return toast("Harga dan jumlah stok harus bilangan bulat yang valid.");
          db.products.push(product);
          try { persist(); } catch { db.products.pop(); return toast("Barang gagal disimpan. Periksa ruang penyimpanan browser."); }
          dialog.close(); page = "products"; render(); toast("Barang baru berhasil ditambahkan.");
        }
        if (event.target.id === "customerForm") {
          event.preventDefault();
          const data = new FormData(event.target);
          const customer = { id: makeId("c"), name: String(data.get("name")).trim(), phone: String(data.get("phone")).trim() || "-", address: String(data.get("address")).trim() || "Alamat belum dicatat" };
          db.customers.push(customer);
          try { persist(); } catch { db.customers.pop(); return toast("Pelanggan gagal disimpan. Periksa ruang penyimpanan browser."); }
          dialog.close(); page = "customers"; render(); toast("Pelanggan berhasil ditambahkan.");
        }
      });

      document.getElementById("todayDate").textContent = new Intl.DateTimeFormat("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(new Date());
      render();
    })();
  </script>
</body>
</html>
